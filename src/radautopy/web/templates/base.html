<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}radautopy{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% set user = request.state.user %}
{% if user %}
<nav>
  <a href="/">Jobs</a>
  {% if user.role == 'admin' %}
  <a href="/jobs/new">New Job</a>
  <a href="/email/edit">Email Config</a>
  {% endif %}
  <a href="/logs">Logs</a>
  {% if user.role == 'admin' %}
  <a href="/rclone">rclone Remotes</a>
  <a href="/settings">Settings</a>
  {% endif %}
  <form class="nav-user" method="post" action="/logout">
    <small>{{ user.username }} ({{ user.role }})</small>
    <button type="submit">Log out</button>
  </form>
</nav>
{% endif %}
<script>
function collectPayload(form) {
  const payload = {};
  form.querySelectorAll('[data-path]').forEach(el => {
    const path = el.dataset.path.split('.');
    let obj = payload;
    for (let i = 0; i < path.length - 1; i++) {
      obj[path[i]] = obj[path[i]] || {};
      obj = obj[path[i]];
    }
    const leaf = path[path.length - 1];
    if (el.type === 'checkbox') {
      obj[leaf] = el.checked;
    } else if (el.dataset.type === 'number') {
      obj[leaf] = Number(el.value);
    } else {
      obj[leaf] = el.value;
    }
  });
  return payload;
}

function showStatus(el, ok, message, warnings = []) {
  el.textContent = message;
  el.className = 'status ' + (ok ? (warnings && warnings.length ? 'warn' : 'ok') : 'error');
  if (warnings && warnings.length) {
    const list = document.createElement('ul');
    list.className = 'warnings';
    warnings.forEach(w => {
      const item = document.createElement('li');
      item.textContent = w;
      list.appendChild(item);
    });
    el.appendChild(list);
  }
}

async function apiFetch(url, options = {}) {
  const raw = options.raw;
  delete options.raw;
  if (options.json !== undefined) {
    options = {...options, method: options.method || 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(options.json)};
    delete options.json;
  }
  let response;
  try {
    response = await fetch(url, options);
  } catch (e) {
    throw new Error(`could not reach the server (${e.message})`);
  }
  if (response.status === 401) {
    window.location.href = `/login?next=${encodeURIComponent(location.pathname + location.search)}`;
    throw new Error('session expired; please log in again');
  }
  const text = await response.text();
  let data = text;
  try {
    data = text ? JSON.parse(text) : {};
  } catch (e) {}
  if (raw && response.ok) return text;
  if (!response.ok) {
    const detail = (data && data.detail) || text || `${response.status} ${response.statusText}`;
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return data;
}

const FILEMAP_FIELDS = ['input_file', 'output_file', 'artist', 'title'];

function buildFilemapTrackRow(track) {
  const row = document.createElement('div');
  row.className = 'filemap-track';
  FILEMAP_FIELDS.forEach(field => {
    const label = document.createElement('label');
    label.textContent = field;
    const input = document.createElement('input');
    input.className = 'filemap-field';
    input.dataset.field = field;
    input.value = track[field] || '';
    label.appendChild(input);
    row.appendChild(label);
  });
  const dup = document.createElement('button');
  dup.type = 'button';
  dup.textContent = 'Duplicate';
  dup.onclick = () => row.after(buildFilemapTrackRow(readFilemapRow(row)));
  row.appendChild(dup);
  const remove = document.createElement('button');
  remove.type = 'button';
  remove.textContent = 'Remove';
  remove.onclick = () => row.remove();
  row.appendChild(remove);
  return row;
}

function readFilemapRow(row) {
  const track = {};
  row.querySelectorAll('.filemap-field').forEach(input => track[input.dataset.field] = input.value);
  return track;
}

function renderFilemapTracks(tracks) {
  const container = document.getElementById('filemap-tracks');
  container.innerHTML = '';
  tracks.forEach(track => container.appendChild(buildFilemapTrackRow(track)));
}

function addFilemapTrack() {
  document.getElementById('filemap-tracks').appendChild(buildFilemapTrackRow({}));
}

function collectFilemapTracks() {
  return Array.from(document.querySelectorAll('#filemap-tracks .filemap-track')).map(readFilemapRow);
}
</script>
{% block content %}{% endblock %}
</body>
</html>
