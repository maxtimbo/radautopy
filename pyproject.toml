[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radautopy"
version = "0.2.3"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "click>=8.1.6",
    "feedparser>=6.0.10",
    "ffmpeg_python>=0.2.0",
    "lxml>=4.9.4",
    "pytaglib>=2.1.0",
    "python3_wget>=0.0.2b1",
    "rclone_python>=0.1.12",
    "Requests>=2.31.0",
    "tabulate>=0.9.0",
    "python-crontab>=3.0.0",
    "paramiko>=2.9.3",
    "python_cart_chunk>=0.0.2b2",
    "numpy>=2.1.1",
    "APScheduler>=3.10.4",
    "cron-descriptor>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
]
requires-python = ">=3.10"
authors = [
    {name = "Tim Finley", email = "tim.finley24@gmail.com"},
]
maintainers = [
    {name = "Tim Finley", email = "tim.finley24@gmail.com"},
]
description = "Download and manipulate audio to prepare shows and segments for radio automation systems"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
radautopy = "radautopy.radauto:cli"
radauto-config = "radautopy.radauto_config:create_modify"
radautopy-scheduler = "radautopy.scheduler:main"
radautopy-web = "radautopy.web.app:main"
radautopy-json-to-sqlite = "radautopy.tools.json_to_sqlite:main"

[tool.setuptools.package-data]
"radautopy.web" = ["templates/*.html", "static/*.css"]
