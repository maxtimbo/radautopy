services:
  scheduler:
    build: .
    command: radautopy-scheduler
    environment:
      - TZ
    volumes:
      - radautopy-data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  web:
    build: .
    command: radautopy-web
    environment:
      - TZ
      - RADAUTOPY_ADMIN_PASSWORD=${RADAUTOPY_ADMIN_PASSWORD:?set RADAUTOPY_ADMIN_PASSWORD in .env}
      - RCLONE_GUI_USER=${RCLONE_GUI_USER:-admin}
      - RCLONE_GUI_PASS=${RCLONE_GUI_PASS}
    ports:
      - "8000:8000"
    volumes:
      - radautopy-data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  rclone-gui:
    image: rclone/rclone:1.75.1
    user: "1000:1000"
    command: >
      gui --no-open-browser
      --addr=0.0.0.0:5522 --api-addr=0.0.0.0:5533
      --user=${RCLONE_GUI_USER:-admin} --pass=${RCLONE_GUI_PASS:?set RCLONE_GUI_PASS in .env}
    environment:
      - TZ
      - RCLONE_CONFIG=/data/rclone.conf
    ports:
      - "5522:5522"
      - "5533:5533"
    volumes:
      - radautopy-data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

volumes:
  radautopy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/tfinley/radautopy
